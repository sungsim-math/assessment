<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미적분 I 수행평가 대기실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 부드러운 고운돋움 폰트 적용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Gowun Dodum"', 'sans-serif'],
                    },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background: linear-gradient(to bottom right, #f8fafc, #eff6ff, #f5f3ff);
            font-family: 'Gowun Dodum', sans-serif;
        }
        
        .glass-panel { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.9); 
            box-shadow: 0 10px 30px -5px rgba(37, 99, 235, 0.15); 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- 배경 장식 (긴장감을 살짝 덜어주는 파스텔톤 빛번짐) -->
    <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse pointer-events-none" style="animation-delay: 2s;"></div>

    <div class="glass-panel rounded-3xl p-8 sm:p-10 max-w-md w-full text-center border-t-4 border-primary-500 relative z-10">
        
        <div class="w-16 h-16 bg-primary-50 border border-primary-100 text-primary-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-sm transform -rotate-3 hover:rotate-3 transition-transform">
            ⏳
        </div>
        
        <div class="inline-block px-3 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded-full mb-4 border border-slate-200">
            2026학년도 2학년 2학기
        </div>
        
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-6">미적분 I 수행평가</h1>
        
        <!-- 핵심 안내 메시지 (기존 접속 버튼을 대체함) -->
        <div class="bg-primary-50 border border-primary-200 rounded-2xl p-6 mb-8 shadow-inner transform transition-transform hover:scale-105">
            <p class="text-primary-800 text-base sm:text-lg font-bold leading-relaxed">
                이 곳은 수행평가 대기실 입니다.<br>
                <span class="text-primary-600 inline-block mt-2 border-b-2 border-primary-300 pb-0.5">리로스쿨 공지사항</span>에 게시된<br>
                실제 평가 링크로 접속하세요.
            </p>
        </div>
        
        <!-- 주의사항 안내 박스 -->
        <div class="bg-white/80 border border-slate-200 rounded-xl p-5 text-sm text-slate-600 text-left shadow-inner">
            <h3 class="font-bold text-slate-800 mb-2 flex items-center gap-1.5">
                <svg class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                평가 진행 안내
            </h3>
            <ul class="list-disc list-inside space-y-2 text-xs sm:text-sm">
                <li>해당 교시 시작 시간에 <strong>리로스쿨 공지사항</strong>이 열립니다.</li>
                <li>안내된 본인 반의 개별 링크를 클릭하여 참여하세요.</li>
                <li>평가 작성 중에는 절대 <strong class="text-primary-600">뒤로가기</strong>를 누르지 마세요.</li>
            </ul>
        </div>

    </div>

</body>
</html>
